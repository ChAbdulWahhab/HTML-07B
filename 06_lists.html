<html>
    <head>
        <title>Lists</title>
    </head>
<body>
    <!-- UL Unordered List -->
    <!-- LI List Item -->

    <ol type="a">
        <li>Peach</li>
        <li>Mango</li>
        <li>Apple</li>
        <li>Strawberry</li>
    </ol>

    <ol type="A">
        <li>Peach</li>
        <li>Mango</li>
        <li>Apple</li>
        <li>Strawberry</li>
    </ol>

    <ol type="i">
        <li>Peach</li>
        <li>Mango</li>
        <li>Apple</li>
        <li>Strawberry</li>
    </ol>

    <ol type="I">
        <li>Peach</li>
        <li>Mango</li>
        <li>Apple</li>
        <li>Strawberry</li>
    </ol>

    <ol type="1">
        <li>Peach</li>
        <li>Mango</li>
        <li>Apple</li>
        <li>Strawberry</li>
    </ol>

    <hr>

    <dl>
        <dt>Coffee</dt>
        <dd>- black hot drink</dd>
        <dt>Milk</dt>
        <dd>- white cold drink</dd>
    </dl>
</body>
</html>
