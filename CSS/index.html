<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- External Styling... -->
    <link rel="stylesheet" href="style.css">

    <!-- Internal Styling... -->
    <style>
        h1 {
            color: mediumseagreen;
        }

        #xyz {
            color: tomato;
        }

        .same {
            color: blueviolet;
        }
    </style>
</head>
<body>
    <!-- Inline Styling... -->
    <h1 style="font-family: Arial, Helvetica, sans-serif;">Hello CSS!</h1>
    <h1 style="font-family: Arial, Helvetica, sans-serif;" id="xyz">Hello CSS!</h1>
    <h1 style="font-family: Arial, Helvetica, sans-serif;" class="same">Hello CSS!</h1>
    <h1 style="font-family: Arial, Helvetica, sans-serif;" class="same">Hello CSS!</h1>
    <h1 style="font-family: Arial, Helvetica, sans-serif;" class="same">Hello CSS!</h1>
    <h1 style="font-family: Arial, Helvetica, sans-serif;">Hello CSS!</h1>
    <h1 style="font-family: Arial, Helvetica, sans-serif;">Hello CSS!</h1>

    <p id="xyz">Lorem ipsum dolor sit amet consectetur adipisicing elit. Beatae, et.</p>
    <ul id="xyz">
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ul>
</body>
</html>
